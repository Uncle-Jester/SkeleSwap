name: Build and Release Addon

on:
  push:
    branches:
      - main
      - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Extract Version from `__init__.py` using awk
        id: get_version
        run: |
          VERSION=$(awk -F '[()]' '/"version": \(/ {print $2}' __init__.py | tr -d ' ' | tr ',' '.')
          echo "Extracted Version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Prepare Addon Files
        run: |
          mkdir -p build/SkeleSwap
          rsync -av --exclude=build --exclude=.git --exclude=.github --exclude=.gitignore . build/SkeleSwap
          rm -rf build/SkeleSwap/docs
          find build/SkeleSwap -name "*.md" -delete
          find build/SkeleSwap -name "*.MD" -delete
          find build/SkeleSwap -name "*.blend1" -delete

      - name: Create Zip Archive (Unstable for main, Stable for release)
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            ZIP_NAME="SkeleSwap_${{ env.VERSION }}_unstable.zip"
            TAG_NAME="latest-unstable"
            RELEASE_NAME="Unstable Build (Main Branch)"
          else
            ZIP_NAME="SkeleSwap_${{ env.VERSION }}.zip"
            TAG_NAME="latest-stable"
            RELEASE_NAME="Stable Release (Release Branch)"
          fi
          cd build
          zip -r $ZIP_NAME SkeleSwap
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV
          echo "Created zip: $ZIP_NAME"

      - name: Upload Artifact (Keep Available in Repo)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: build/${{ env.ZIP_NAME }}

      - name: Delete Existing Tag (if it exists)
        run: |
          git tag -d ${{ env.TAG_NAME }} || true
          git push origin --delete ${{ env.TAG_NAME }} || true
        continue-on-error: true

      - name: Create and Push Tag
        run: |
          git tag ${{ env.TAG_NAME }}
          git push origin ${{ env.TAG_NAME }}

      - name: Create GitHub Release (For Both Branches)
        uses: softprops/action-gh-release@v1
        with:
          files: build/${{ env.ZIP_NAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.TAG_NAME }}
          name: "${{ env.RELEASE_NAME }}"
          body: "New ${{ env.RELEASE_NAME }} of SkeleSwap."
          draft: false
          prerelease: ${{ github.ref == 'refs/heads/main' }}
