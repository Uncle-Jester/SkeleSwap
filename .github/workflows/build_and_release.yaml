name: Build and Release Addon

on:
  push:
    branches:
      - main
      - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create addon zip
        run: |
          mkdir -p addon
          cp -r your-addon-folder/* addon/
          rm -rf addon/README.md addon/doc
          zip -r SkeleSwap.zip addon

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: SkeleSwap
          path: SkeleSwap.zip

  release:
    if: github.ref == 'refs/heads/release'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v3
        with:
          name: SkeleSwap

      - name: Create GitHub release
        uses: actions/create-release@v1
        with:
          tag_name: v${{ github.run_number }}
          release_name: "SkeleSwap v${{ github.run_number }}"
          draft: false
          prerelease: false
          files: SkeleSwap.zip